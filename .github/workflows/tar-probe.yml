name: tar probe
on:
  push:
    paths: [.github/workflows/tar-probe.yml]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          tar.exe --version
          $root = Join-Path $env:RUNNER_TEMP 'p'; New-Item -ItemType Directory $root | Out-Null
          foreach ($name in 'Photo', 'Фото') {
            $dir = New-Item -ItemType Directory (Join-Path $root $name)
            Set-Content -Encoding utf8 (Join-Path $dir 'note.txt') 'hi'
            Set-Content -Encoding utf8 (Join-Path $dir 'заметка.txt') 'привет'
          }
          Set-Content -Encoding utf8 (Join-Path $root 'loose.txt') 'x'
          function Probe-Tar($label, [string[]]$a, $out) {
            Push-Location $root
            & tar.exe @a 2>&1 | Out-Host
            $code = $LASTEXITCODE
            Pop-Location
            $list = if ($code -eq 0) { (& tar.exe -tvf $out 2>&1) -join ' | ' } else { '' }
            Write-Host ("CASE {0} -> exit {1}; list: {2}" -f $label, $code, $list)
          }
          $ascii = New-Item -ItemType Directory (Join-Path $root 'Ascii'); Set-Content (Join-Path $ascii 'one.txt') 'x'
          New-Item -ItemType Directory (Join-Path $ascii 'sub') | Out-Null; Set-Content (Join-Path $ascii 'sub\two.txt') 'y'
          Set-Content -Encoding utf8 (Join-Path $root 'заметка.txt') 'привет'
          $cyr = New-Item -ItemType Directory (Join-Path $root 'Папка'); Set-Content (Join-Path $cyr 'one.txt') 'x'
          $lat = New-Item -ItemType Directory (Join-Path $root 'Café'); Set-Content (Join-Path $lat 'résumé.txt') 'x'
          foreach ($f in 'ustar', '7zip', 'iso9660') {
            Probe-Tar "$f latin1-folder" @('--format', $f, '-cf', "$root\l-$f.out", '-C', $root, 'Café') "$root\l-$f.out"
          }
          Add-Type -AssemblyName System.IO.Compression.FileSystem
          [IO.Compression.ZipFile]::CreateFromDirectory("$root\Café", "$root\read.zip", 'Optimal', $true, [Text.Encoding]::UTF8)
          & tar.exe -tf "$root\read.zip" 2>&1 | Out-Host; Write-Host "CASE read-list latin1 zip -> exit $LASTEXITCODE"
          $x = New-Item -ItemType Directory (Join-Path $root 'x')
          & tar.exe -xf "$root\read.zip" -C $x 2>&1 | Out-Host; Write-Host "CASE read-extract latin1 zip -> exit $LASTEXITCODE; $((Get-ChildItem -Recurse $x).Name -join ' | ')"
          Get-ItemProperty 'HKLM:\SYSTEM\CurrentControlSet\Control\Nls\CodePage' | Select-Object ACP, OEMCP | Out-Host
          (Get-Item C:\Windows\System32\tar.exe).VersionInfo | Format-List FileVersion, ProductVersion | Out-Host
          # Windows' System32 tar vs. the one in Git for Windows, for comparison
          Get-Command tar.exe -All | ForEach-Object { Write-Host "tar at $($_.Source)" }
