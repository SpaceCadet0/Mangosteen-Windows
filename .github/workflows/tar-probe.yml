name: tar probe
on:
  push:
    paths: [.github/workflows/tar-probe.yml]
jobs:
  probe:
    runs-on: windows-latest
    steps:
      - shell: pwsh
        run: |
          tar.exe --version
          $root = Join-Path $env:RUNNER_TEMP 'p'; New-Item -ItemType Directory $root | Out-Null
          foreach ($name in 'Photo', 'Фото') {
            $dir = New-Item -ItemType Directory (Join-Path $root $name)
            Set-Content -Encoding utf8 (Join-Path $dir 'note.txt') 'hi'
            Set-Content -Encoding utf8 (Join-Path $dir 'заметка.txt') 'привет'
          }
          Set-Content -Encoding utf8 (Join-Path $root 'loose.txt') 'x'
          function Probe-Tar($label, [string[]]$a, $out) {
            Push-Location $root
            & tar.exe @a 2>&1 | Out-Host
            $code = $LASTEXITCODE
            Pop-Location
            $list = if ($code -eq 0) { (& tar.exe -tvf $out 2>&1) -join ' | ' } else { '' }
            Write-Host ("CASE {0} -> exit {1}; list: {2}" -f $label, $code, $list)
          }
          foreach ($f in 'ustar', 'pax', 'zip', '7zip', 'iso9660') {
            Probe-Tar "$f file" @('--format', $f, '-cf', "$root\a-$f.out", '-C', $root, 'loose.txt') "$root\a-$f.out"
            Probe-Tar "$f folder" @('--format', $f, '-cf', "$root\b-$f.out", '-C', $root, 'Photo') "$root\b-$f.out"
            Probe-Tar "$f folder-n+files" @('--format', $f, '-n', '-cf', "$root\c-$f.out", '-C', $root, 'Photo', 'Photo/note.txt', 'Photo/заметка.txt') "$root\c-$f.out"
            Probe-Tar "$f files-in-folder" @('--format', $f, '-cf', "$root\d-$f.out", '-C', $root, 'Photo/note.txt', 'Photo/заметка.txt') "$root\d-$f.out"
            Probe-Tar "$f relative-out" @('--format', $f, '-cf', "e-$f.out", 'Photo') "$root\e-$f.out"
          }
          # Windows' System32 tar vs. the one in Git for Windows, for comparison
          Get-Command tar.exe -All | ForEach-Object { Write-Host "tar at $($_.Source)" }
