name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: write # the release step attaches Mangosteen-win-x64.zip to a GitHub release when a v* tag is pushed

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ffmpeg-cache/ffmpeg.zip
          key: ffmpeg-${{ hashFiles('build/ffmpeg.pin') }}

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./build/fetch-ffmpeg.ps1

      - name: Restore
        run: dotnet restore Mangosteen.sln

      - name: Build
        run: dotnet build Mangosteen.sln -c Release --no-restore

      - name: Test
        run: dotnet test Mangosteen.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: dotnet publish src/Mangosteen/Mangosteen.csproj -c Release -r win-x64 -o publish

      - name: Check the publish folder holds only Mangosteen.exe
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File | Select-Object -ExpandProperty Name
          Write-Host "publish: $($files -join ', ')"
          $extra = $files | Where-Object { $_ -ne 'Mangosteen.exe' }
          if ($extra) { throw "Unexpected files next to Mangosteen.exe: $($extra -join ', ')" }
          $size = (Get-Item publish/Mangosteen.exe).Length / 1MB
          Write-Host ("Mangosteen.exe: {0:N1} MB" -f $size)

      - name: Media self-test of the published exe
        shell: pwsh
        run: |
          $process = Start-Process publish/Mangosteen.exe -ArgumentList '--media-self-test' -Wait -PassThru
          Get-Content (Join-Path $env:LOCALAPPDATA 'Mangosteen/mangosteen.log') -Tail 15
          if ($process.ExitCode -ne 0) { throw "Media self-test failed with exit code $($process.ExitCode)" }

      - name: Idle CPU, memory and size
        shell: pwsh
        run: |
          # Start the published exe as a user would (tray icon and hooks, welcome already seen), let it settle, then
          # measure it doing nothing. The numbers go to the job summary and to the stats artifact (README strip).
          New-Item -ItemType Directory -Force (Join-Path $env:LOCALAPPDATA 'Mangosteen') | Out-Null
          Set-Content (Join-Path $env:LOCALAPPDATA 'Mangosteen/settings.json') '{"Language":"en","WelcomeShown":true}'
          $process = Start-Process publish/Mangosteen.exe -PassThru
          Start-Sleep -Seconds 20
          $process.Refresh()
          $cpu0 = $process.TotalProcessorTime
          $clock = [Diagnostics.Stopwatch]::StartNew()
          Start-Sleep -Seconds 60
          $process.Refresh()
          $cpuSeconds = ($process.TotalProcessorTime - $cpu0).TotalSeconds
          $elapsed = $clock.Elapsed.TotalSeconds
          $privateWorkingSet = (Get-Counter "\Process(Mangosteen)\Working Set - Private").CounterSamples[0].CookedValue
          $windows = if ($process.MainWindowHandle -eq 0) { 'none' } else { $process.MainWindowTitle }
          $stats = [ordered]@{
            'idle CPU, % of one core (60 s)' = '{0:N2}' -f ($cpuSeconds / $elapsed * 100)
            'idle CPU, % of all cores (Task Manager)' = '{0:N2}' -f ($cpuSeconds / $elapsed * 100 / [Environment]::ProcessorCount)
            'CPU time while idle, ms' = '{0:N0}' -f ($cpuSeconds * 1000)
            'memory, private working set (Task Manager), MB' = '{0:N1}' -f ($privateWorkingSet / 1MB)
            'memory, working set, MB' = '{0:N1}' -f ($process.WorkingSet64 / 1MB)
            'memory, private bytes, MB' = '{0:N1}' -f ($process.PrivateMemorySize64 / 1MB)
            'windows open at launch' = $windows
            'Mangosteen.exe, MB' = '{0:N1}' -f ((Get-Item publish/Mangosteen.exe).Length / 1MB)
          }
          $private = $process.PrivateMemorySize64
          Stop-Process $process -Force
          New-Item -ItemType Directory -Force stats | Out-Null
          Compress-Archive publish/Mangosteen.exe stats/Mangosteen-win-x64.zip -CompressionLevel Optimal
          $stats['Mangosteen-win-x64.zip, MB'] = '{0:N1}' -f ((Get-Item stats/Mangosteen-win-x64.zip).Length / 1MB)
          Remove-Item stats/Mangosteen-win-x64.zip
          $stats['runner'] = "$([Environment]::OSVersion.VersionString), $([Environment]::ProcessorCount) cores"
          $lines = $stats.GetEnumerator() | ForEach-Object { "$($_.Key): $($_.Value)" }
          $lines | Set-Content stats/stats.txt
          $lines | ForEach-Object { Write-Host $_ }
          "### Idle measurements`n" + (($stats.GetEnumerator() | ForEach-Object { "- $($_.Key): **$($_.Value)**" }) -join "`n") | Add-Content $env:GITHUB_STEP_SUMMARY
          if ($private -gt 80MB) { throw "Idle private memory is above 80 MB" }

      - uses: actions/upload-artifact@v7
        with:
          name: stats
          path: stats

      - name: Tool window snapshots
        # Layout checks only; a crash here must not stop the README screenshots and the build artifacts.
        continue-on-error: true
        shell: pwsh
        run: |
          $fixtures = Resolve-Path tests/fixtures
          # Video and audio fixtures, made with the FFmpeg the self-test unpacked.
          $ffmpeg = (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Mangosteen/ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=25:duration=6 -f lavfi -i "sine=frequency=440:duration=6" -c:v libx264 -pix_fmt yuv420p -c:a aac (Join-Path $fixtures 'clip.mp4')
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "smptebars=size=640x360:rate=25:duration=4" -f lavfi -i "sine=frequency=660:duration=4" -c:v libx264 -pix_fmt yuv420p -c:a aac (Join-Path $fixtures 'clip2.mp4')
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "aevalsrc=0.6*sin(2*PI*330*t)*sin(PI*t/2):d=8" -c:a libmp3lame -q:a 4 (Join-Path $fixtures 'song.mp3')
          $tools = @(
            @{ id = 'tool.crop'; files = @('photo.jpg', 'portrait.jpg') },
            @{ id = 'tool.compress'; files = @('photo.jpg', 'document.pdf') },
            @{ id = 'tool.metadata'; files = @('photo.jpg') },
            @{ id = 'tool.frame'; files = @('photo.jpg') },
            @{ id = 'tool.collage'; files = @('photo.jpg', 'portrait.jpg', 'photo.jpg') },
            @{ id = 'tool.organizePDF'; files = @('document.pdf') },
            @{ id = 'tool.splitPDF'; files = @('document.pdf') },
            @{ id = 'tool.splitPDF'; files = @('document.pdf'); language = 'ru'; name = 'ru.tool.splitPDF' },
            @{ id = 'tool.crop'; files = @('photo.jpg'); demo = $true; name = 'tool.crop.split' },
            @{ id = 'tool.edit'; files = @('photo.jpg') },
            @{ id = 'tool.redact'; files = @('photo.jpg', 'portrait.jpg') },
            @{ id = 'tool.annotate'; files = @('photo.jpg') },
            @{ id = 'tool.trimMedia'; files = @('clip.mp4') },
            @{ id = 'tool.splitMedia'; files = @('clip.mp4') },
            @{ id = 'tool.frames'; files = @('clip.mp4') },
            @{ id = 'tool.speed'; files = @('clip.mp4') },
            @{ id = 'tool.normalize'; files = @('song.mp3') },
            @{ id = 'tool.channels'; files = @('song.mp3') },
            @{ id = 'tool.compressMedia'; files = @('clip.mp4') },
            @{ id = 'tool.join'; files = @('clip.mp4', 'clip2.mp4') },
            @{ id = 'tool.cropVideo'; files = @('clip.mp4') },
            @{ id = 'tool.bleep'; files = @('song.mp3') },
            @{ id = 'tool.visualizer'; files = @('song.mp3') },
            @{ id = 'tool.redactVideo'; files = @('clip.mp4') },
            @{ id = 'welcome'; files = @() },
            @{ id = 'traymenu'; files = @() },
            @{ id = 'traymenu-dark'; files = @(); language = 'ru' },
            @{ id = 'settings'; files = @() },
            @{ id = 'tool.compress'; files = @('photo.jpg'); language = 'ru'; name = 'ru.tool.compress' },
            @{ id = 'tool.trimMedia'; files = @('clip.mp4'); language = 'ru'; name = 'ru.tool.trimMedia' },
            @{ id = 'welcome'; files = @(); language = 'ru'; name = 'ru.welcome' },
            @{ id = 'tool.edit'; files = @('photo.jpg'); language = 'es'; name = 'es.tool.edit' }
          )
          New-Item -ItemType Directory -Force snapshots | Out-Null
          foreach ($tool in $tools) {
            $name = if ($tool.name) { $tool.name } else { $tool.id }
            $output = Join-Path (Resolve-Path snapshots) ($name + '.png')
            $env:MANGOSTEEN_LANGUAGE = if ($tool.language) { $tool.language } else { 'en' }
            $env:MANGOSTEEN_SNAPSHOT_DEMO = if ($tool.demo) { '1' } else { '' }
            $arguments = @('--snapshot', $tool.id, $output) + ($tool.files | ForEach-Object { Join-Path $fixtures $_ })
            $process = Start-Process publish/Mangosteen.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0) {
              Write-Host ("snapshot {0} exited with 0x{1:X8}; trying again" -f $tool.id, $process.ExitCode)
              $process = Start-Process publish/Mangosteen.exe -ArgumentList $arguments -Wait -PassThru
            }
            if ($process.ExitCode -ne 0 -or -not (Test-Path $output)) {
              Get-Content (Join-Path $env:LOCALAPPDATA 'Mangosteen/mangosteen.log') -Tail 40
              throw "Snapshot of $($tool.id) failed"
            }
            Write-Host "snapshot: $($tool.id)"
          }

      - name: README screenshots
        shell: pwsh
        run: |
          # Real windows in the dark theme over the real photos in docs/images/source; the video is a slow zoom into
          # the second photo with a sound track. A selection in the middle of the timeline, as a person would make.
          $source = Resolve-Path docs/images/source
          $ffmpeg = (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Mangosteen/ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          $video = Join-Path $source 'Mangosteen.mp4'
          & $ffmpeg -hide_banner -loglevel error -y -i (Join-Path $source 'mangosteen-video.jpg') `
            -f lavfi -i "aevalsrc=0.25*sin(2*PI*220*t)*(0.6+0.4*sin(2*PI*0.5*t))+0.18*sin(2*PI*277*t)+0.15*sin(2*PI*330*t)*abs(sin(2*PI*0.8*t)):d=30:s=44100" `
            -filter_complex "[0:v]scale=2560:1440:force_original_aspect_ratio=increase,crop=2560:1440,zoompan=z=1+0.0003*on:x=iw/2-(iw/zoom/2):y=ih/2-(ih/zoom/2):d=750:s=1280x720:fps=25,format=yuv420p[v]" `
            -map "[v]" -map 1:a -t 30 -c:v libx264 -preset veryfast -crf 22 -c:a aac -b:a 128k $video
          if (-not (Test-Path $video)) { throw "The README video was not made" }
          $photo = Join-Path $source 'mangosteen-still.jpg'
          $shots = @(
            @{ id = 'tool.annotate'; files = @($photo) },
            @{ id = 'tool.frame'; files = @($photo) },
            @{ id = 'tool.edit'; files = @($photo) },
            @{ id = 'tool.compress'; files = @($photo) },
            @{ id = 'tool.trimMedia'; files = @($video) },
            @{ id = 'tool.bleep'; files = @($video) },
            @{ id = 'tool.redactVideo'; files = @($video) },
            @{ id = 'welcome'; files = @() }
          )
          $env:MANGOSTEEN_THEME = 'dark'
          $env:MANGOSTEEN_SNAPSHOT_DEMO = '1'
          $env:MANGOSTEEN_SCREEN = '1'
          foreach ($language in @('en', 'ru')) {
            $folder = New-Item -ItemType Directory -Force (Join-Path 'readme-screenshots' $language)
            $env:MANGOSTEEN_LANGUAGE = $language
            foreach ($shot in $shots) {
              $output = Join-Path $folder.FullName ($shot.id.Replace('tool.', '') + '.png')
              $arguments = @('--snapshot', $shot.id, $output) + $shot.files
              $process = Start-Process publish/Mangosteen.exe -ArgumentList $arguments -Wait -PassThru
              if ($process.ExitCode -ne 0) {
                Write-Host ("snapshot {0} exited with 0x{1:X8}; trying again" -f $shot.id, $process.ExitCode)
                $process = Start-Process publish/Mangosteen.exe -ArgumentList $arguments -Wait -PassThru
              }
              if ($process.ExitCode -ne 0 -or -not (Test-Path $output)) {
                Get-Content (Join-Path $env:LOCALAPPDATA 'Mangosteen/mangosteen.log') -Tail 40
                throw "README screenshot of $($shot.id) ($language) failed"
              }
              Write-Host "readme: $language $($shot.id)"
            }
          }
          Get-Content (Join-Path $env:LOCALAPPDATA 'Mangosteen/mangosteen.log') | Select-String 'snapshot background' | Select-Object -Last 3

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: readme-screenshots
          path: readme-screenshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tool-snapshots
          path: snapshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: Mangosteen-win-x64
          path: publish/Mangosteen.exe
          if-no-files-found: error

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = '${{ github.ref_name }}'
          Compress-Archive publish/Mangosteen.exe Mangosteen-win-x64.zip -CompressionLevel Optimal
          gh release create $tag Mangosteen-win-x64.zip --title "Mangosteen for Windows $($tag.TrimStart('v'))" --notes-file "docs/releases/$tag.md"
