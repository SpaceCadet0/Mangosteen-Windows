name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    env:
      DOTNET_NOLOGO: true
      DOTNET_CLI_TELEMETRY_OPTOUT: true
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - uses: actions/cache@v6
        with:
          path: ffmpeg-cache/ffmpeg.zip
          key: ffmpeg-${{ hashFiles('build/ffmpeg.pin') }}

      - name: Fetch FFmpeg
        shell: pwsh
        run: ./build/fetch-ffmpeg.ps1

      - name: Restore
        run: dotnet restore Mangosteen.sln

      - name: Build
        run: dotnet build Mangosteen.sln -c Release --no-restore

      - name: Test
        run: dotnet test Mangosteen.sln -c Release --no-build --logger "console;verbosity=normal"

      - name: Publish single-file exe
        run: dotnet publish src/Mangosteen/Mangosteen.csproj -c Release -r win-x64 -o publish

      - name: Check the publish folder holds only Mangosteen.exe
        shell: pwsh
        run: |
          $files = Get-ChildItem publish -File | Select-Object -ExpandProperty Name
          Write-Host "publish: $($files -join ', ')"
          $extra = $files | Where-Object { $_ -ne 'Mangosteen.exe' }
          if ($extra) { throw "Unexpected files next to Mangosteen.exe: $($extra -join ', ')" }
          $size = (Get-Item publish/Mangosteen.exe).Length / 1MB
          Write-Host ("Mangosteen.exe: {0:N1} MB" -f $size)

      - name: Media self-test of the published exe
        shell: pwsh
        run: |
          $process = Start-Process publish/Mangosteen.exe -ArgumentList '--media-self-test' -Wait -PassThru
          Get-Content (Join-Path $env:LOCALAPPDATA 'Mangosteen/mangosteen.log') -Tail 15
          if ($process.ExitCode -ne 0) { throw "Media self-test failed with exit code $($process.ExitCode)" }

      - name: Tool window snapshots
        shell: pwsh
        run: |
          $fixtures = Resolve-Path tests/fixtures
          # Video and audio fixtures, made with the FFmpeg the self-test unpacked.
          $ffmpeg = (Get-ChildItem (Join-Path $env:LOCALAPPDATA 'Mangosteen/ffmpeg') -Recurse -Filter ffmpeg.exe | Select-Object -First 1).FullName
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i testsrc2=size=640x360:rate=25:duration=6 -f lavfi -i "sine=frequency=440:duration=6" -c:v libx264 -pix_fmt yuv420p -c:a aac (Join-Path $fixtures 'clip.mp4')
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "smptebars=size=640x360:rate=25:duration=4" -f lavfi -i "sine=frequency=660:duration=4" -c:v libx264 -pix_fmt yuv420p -c:a aac (Join-Path $fixtures 'clip2.mp4')
          & $ffmpeg -hide_banner -loglevel error -y -f lavfi -i "aevalsrc=0.6*sin(2*PI*330*t)*sin(PI*t/2):d=8" -c:a libmp3lame -q:a 4 (Join-Path $fixtures 'song.mp3')
          $tools = @(
            @{ id = 'tool.crop'; files = @('photo.jpg', 'portrait.jpg') },
            @{ id = 'tool.compress'; files = @('photo.jpg', 'document.pdf') },
            @{ id = 'tool.metadata'; files = @('photo.jpg') },
            @{ id = 'tool.frame'; files = @('photo.jpg') },
            @{ id = 'tool.collage'; files = @('photo.jpg', 'portrait.jpg', 'photo.jpg') },
            @{ id = 'tool.organizePDF'; files = @('document.pdf') },
            @{ id = 'tool.edit'; files = @('photo.jpg') },
            @{ id = 'tool.redact'; files = @('photo.jpg', 'portrait.jpg') },
            @{ id = 'tool.annotate'; files = @('photo.jpg') },
            @{ id = 'tool.trimMedia'; files = @('clip.mp4') },
            @{ id = 'tool.splitMedia'; files = @('clip.mp4') },
            @{ id = 'tool.frames'; files = @('clip.mp4') },
            @{ id = 'tool.speed'; files = @('clip.mp4') },
            @{ id = 'tool.normalize'; files = @('song.mp3') },
            @{ id = 'tool.channels'; files = @('song.mp3') },
            @{ id = 'tool.compressMedia'; files = @('clip.mp4') },
            @{ id = 'tool.join'; files = @('clip.mp4', 'clip2.mp4') },
            @{ id = 'tool.cropVideo'; files = @('clip.mp4') },
            @{ id = 'tool.bleep'; files = @('song.mp3') },
            @{ id = 'tool.visualizer'; files = @('song.mp3') },
            @{ id = 'tool.redactVideo'; files = @('clip.mp4') },
            @{ id = 'welcome'; files = @() },
            @{ id = 'settings'; files = @() },
            @{ id = 'tool.compress'; files = @('photo.jpg'); language = 'ru'; name = 'ru.tool.compress' },
            @{ id = 'tool.trimMedia'; files = @('clip.mp4'); language = 'ru'; name = 'ru.tool.trimMedia' },
            @{ id = 'welcome'; files = @(); language = 'ru'; name = 'ru.welcome' },
            @{ id = 'tool.edit'; files = @('photo.jpg'); language = 'es'; name = 'es.tool.edit' }
          )
          New-Item -ItemType Directory -Force snapshots | Out-Null
          foreach ($tool in $tools) {
            $name = if ($tool.name) { $tool.name } else { $tool.id }
            $output = Join-Path (Resolve-Path snapshots) ($name + '.png')
            $env:MANGOSTEEN_LANGUAGE = if ($tool.language) { $tool.language } else { 'en' }
            $arguments = @('--snapshot', $tool.id, $output) + ($tool.files | ForEach-Object { Join-Path $fixtures $_ })
            $process = Start-Process publish/Mangosteen.exe -ArgumentList $arguments -Wait -PassThru
            if ($process.ExitCode -ne 0 -or -not (Test-Path $output)) {
              Get-Content (Join-Path $env:LOCALAPPDATA 'Mangosteen/mangosteen.log') -Tail 40
              throw "Snapshot of $($tool.id) failed"
            }
            Write-Host "snapshot: $($tool.id)"
          }

      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: tool-snapshots
          path: snapshots
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v7
        with:
          name: Mangosteen-win-x64
          path: publish/Mangosteen.exe
          if-no-files-found: error
